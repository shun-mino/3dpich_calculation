<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>表面積・ピッチ計算ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>表面積 → ピッチ長さ計算</h1>

<div class="common">
  ヒーター全長 (mm)<br>
  <input id="heater" type="number">
</div>

<div class="tabs">
  <button onclick="showTab('box')">四角柱</button>
  <button onclick="showTab('cyl')">円柱</button>
  <button onclick="showTab('cone')">円錐</button>
  <button onclick="showTab('pyr')">四角錐</button>
  <button onclick="showTab('ang')">Lアングル</button>
  <button onclick="showTab('trap')">四角錐台</button>
</div>

<!-- 四角柱 -->
<div id="box" class="tab">
  <img src="SP.png" class="shape-img">

  縦 <input id="bx"> 横 <input id="by"><br>
  高さ <input id="bh">
  <button onclick="calcBox()">計算</button>
  <p id="br"></p>
</div>

<!-- 円柱 -->
<div id="cyl" class="tab">
  <img src="CY.png" class="shape-img">

  直径 <input id="cd"> 高さ <input id="ch">
  <button onclick="calcCyl()">計算</button>
  <p id="cr"></p>
</div>

<!-- 円錐 -->
<div id="cone" class="tab">
  <img src="CONE.png" class="shape-img">

  直径 <input id="co_d"> 高さ <input id="co_h">
  <button onclick="calcCone()">計算</button>
  <p id="cor"></p>
</div>

<!-- 四角錐 -->
<div id="pyr" class="tab">
  <img src="S.png" class="shape-img">

  縦 <input id="px"> 横 <input id="py"><br>
  高さ <input id="ph">
  <button onclick="calcPyr()">計算</button>
  <p id="pr"></p>
</div>

<!-- Lアングル -->
<div id="ang" class="tab">
  <img src="L-angle.png" class="shape-img">

  外縦 <input id="ax"> 外横 <input id="ay"><br>
  高さ <input id="ah"> 肉厚 <input id="at">
  <button onclick="calcAng()">計算</button>
  <p id="ar"></p>
</div>

<!-- 四角錐台 -->
<div id="trap" class="tab">
  <img src="TP.png" class="shape-img">

  上底 <input id="ta"> 下底 <input id="tb"><br>
  高さ <input id="th"> 奥行 <input id="td">
  <button onclick="calcTrap()">計算</button>
  <p id="tr"></p>
</div>

<script src="script.js"></script>
</body>
</html>
