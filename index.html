<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>表面積・ピッチ計算ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>表面積 → ピッチ長さ計算</h1>

<div class="common">
  ヒーター全長 (m)<br>
  <input id="heater" type="number">
</div>

<div class="tabs">
  <button onclick="showTab('box')">四角柱</button>
  <button onclick="showTab('cyl')">円柱</button>
  <button onclick="showTab('cylellip')">円柱＋回転楕円体</button>
  <button onclick="showTab('cone')">円錐</button>
  <button onclick="showTab('pyr')">四角錐</button>
  <!--<button onclick="showTab('ang')">Lアングル</button>-->
  <button onclick="showTab('trap')">四角錐台</button>
</div>

<!-- 四角柱 -->
<div id="box" class="tab">
  <img src="SP.png" class="shape-img">
  
  縦(mm) <input id="bx"><br>
  横(mm) <input id="by"><br>
  高さ(mm) <input id="bh">
  <button onclick="calcBox()">計算</button>
  <p id="br"></p>
</div>

<!-- 円柱 -->
<div id="cyl" class="tab">
  <img src="CY.png" class="shape-img">


  直径(mm) <input id="cd"><br>
  高さ(mm) <input id="ch">
  <button onclick="calcCyl()">計算</button>
  <p id="cr"></p>
</div>

<!-- 円柱＋回転楕円体 -->
<div id="cylellip" class="tab">
  <img src="CE.png" class="shape-img">

  直径 D(mm) <input id="ced"><br>
  円柱高さ H1(mm) <input id="ceh1"><br>
  楕円高さ H2(mm) <input id="ceh2"><br>

  <button onclick="calcCylEllip()">計算</button>
  <p id="cer"></p>
</div>

<!-- 円錐 -->
<div id="cone" class="tab">
  <img src="CONE.png" class="shape-img">

  
  直径(mm) <input id="co_d"><br>
  高さ(mm) <input id="co_h">
  <button onclick="calcCone()">計算</button>
  <p id="cor"></p>
</div>

<!-- 四角錐 -->
<div id="pyr" class="tab">
  <img src="S.png" class="shape-img">

  縦(mm) <input id="px"><br>
  横(mm) <input id="py"><br>
  高さ(mm) <input id="ph">
  <button onclick="calcPyr()">計算</button>
  <p id="pr"></p>
</div>

<!-- Lアングル 
<div id="ang" class="tab">
  <img src="L-angle.png" class="shape-img">

  外縦(mm) <input id="ax"><br>
  外横(mm) <input id="ay"><br>
  高さ(mm) <input id="ah"><br>
  肉厚(mm) <input id="at">
  <button onclick="calcAng()">計算</button>
  <p id="ar"></p>
</div>-->

<!-- 四角錐台 -->
<div id="trap" class="tab">
  <img src="TP.png" class="shape-img">

  上縦(mm) <input id="ut"><br> 
  上横(mm) <input id="uy"><br>
  下縦(mm) <input id="st"><br>
  下横(mm) <input id="sy"><br>
  高さ(mm) <input id="h">
  <button onclick="calcTrap()">計算</button>
  <p id="tr"></p>
</div>

<script src="script.js"></script>
</body>
</html>
